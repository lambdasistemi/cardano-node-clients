site_name: cardano-node-clients
site_url: https://lambdasistemi.github.io/cardano-node-clients/
repo_url: https://github.com/lambdasistemi/cardano-node-clients

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - navigation.path

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage:
      - utxo-indexer: usage/utxo-indexer.md
      - cardano-adversary: usage/cardano-adversary.md
  - Architecture: architecture.md
  - Modules:
      - Provider: modules/provider.md
      - Submitter: modules/submitter.md
      - N2C: modules/n2c.md
      - Validity: modules/validity.md
      - Indexers: modules/indexers.md
